services:
  postgres:
    image: postgres:16-alpine
    container_name: procura-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: procura_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d procura_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - procura-network

  redis:
    image: redis:7-alpine
    container_name: procura-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - procura-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: procura-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/procura_ai
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - procura-network

volumes:
  postgres_data:
    name: procura-postgres-data
  redis_data:
    name: procura-redis-data

networks:
  procura-network:
    name: procura-network
    driver: bridge
